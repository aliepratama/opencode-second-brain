[project]
name = "opencode-second-brain"
version = "0.1.0"
description = "A minimal, ready-to-use PARA second brain starter pack for OpenCode and Obsidian"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Alie Pratama", email = "aliepratama@users.noreply.github.com" },
]
keywords = ["para", "second-brain", "obsidian", "opencode", "knowledge-management", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aliepratama/opencode-second-brain"
"Bug Reports" = "https://github.com/aliepratama/opencode-second-brain/issues"
"Source" = "https://github.com/aliepratama/opencode-second-brain"

[tool.setuptools.packages.find]
include = [".opencode.skills._shared*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
